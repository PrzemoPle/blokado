<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#191627">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blokado">
<title>Blokado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=0.5.2">
</head>
<body>

<header>
  <div class="logo"><span class="k1">B</span><span class="k2">L</span><span class="k3">O</span><span class="k4">K</span><span class="k5">A</span><span class="k6">D</span><span class="k1">O</span></div>
  <div class="hright">
    <button class="icon-btn" id="menu-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <rect x="3" y="3" width="8" height="8" rx="2.5" fill="var(--c1)"/>
        <rect x="13" y="3" width="8" height="8" rx="2.5" fill="var(--c2)"/>
        <rect x="3" y="13" width="8" height="8" rx="2.5" fill="var(--c3)"/>
        <rect x="13" y="13" width="8" height="8" rx="2.5" fill="var(--c4)"/>
      </svg>
    </button>
    <button class="icon-btn mute-btn" aria-label="Audio">
      <svg class="snd-on" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.4h3l4.6-3.8v12.8L7 14.6H4z" fill="currentColor"/>
        <path d="M15.3 9.3a3.8 3.8 0 0 1 0 5.4"/>
        <path d="M17.9 6.9a7.2 7.2 0 0 1 0 10.2"/>
      </svg>
      <svg class="snd-off" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.4h3l4.6-3.8v12.8L7 14.6H4z" fill="currentColor"/>
        <path d="M15.6 9.6l5 4.8M20.6 9.6l-5 4.8"/>
      </svg>
    </button>
    <div class="scores">
      <div class="score-box"><div class="label" data-i18n="score">Wynik</div><div class="val" id="score">0</div></div>
      <div class="score-box"><div class="label" data-i18n="best">Rekord</div><div class="val" id="best">0</div></div>
    </div>
  </div>
</header>

<div id="statusbar">
  <div id="layout-name"></div>
  <div class="tokens">
    <span style="font-size:14px">&#8635;</span>
    <div class="tok" id="tok0">&#8635;</div>
    <div class="tok" id="tok1">&#8635;</div>
    <div class="tok" id="tok2">&#8635;</div>
  </div>
</div>

<div id="board-wrap"><div id="board"></div></div>

<div id="powerbar-row">
  <div id="powerlabel" data-i18n="colorbar">Pasek koloru</div>
  <div id="powerbar"><div class="seg"></div><div class="seg"></div><div class="seg"></div></div>
  <div id="bomb-slot" aria-label="Bomb">
    <svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true">
      <path d="M15.6 8.4 Q17.2 5.6 19.4 6.2" stroke="var(--c5)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="5.8" r="1.7" fill="var(--c2)"/>
      <circle cx="11" cy="14" r="7.6" fill="#2E2945"/>
      <circle cx="11" cy="14" r="7.6" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
      <circle cx="8.4" cy="11.4" r="2.3" fill="rgba(255,255,255,.32)"/>
    </svg>
  </div>
</div>

<div id="tray"></div>
<div id="drag-ghost"></div>
<footer>
  <div id="hint" data-i18n="hint"></div>
  <div class="credits" data-i18n="credits"></div>
</footer>

<!-- MENU -->
<div class="overlay show" id="menu">
  <div class="panel">
    <div class="deco" style="width:30px;height:30px;background:var(--c2);top:-14px;left:-12px;--rot:-12deg;animation-delay:0s"></div>
    <div class="deco" style="width:22px;height:22px;background:var(--c3);top:24px;right:-14px;--rot:9deg;animation-delay:.8s"></div>
    <div class="deco" style="width:24px;height:24px;background:var(--c5);bottom:60px;left:-16px;--rot:7deg;animation-delay:1.6s"></div>
    <div class="deco" style="width:32px;height:32px;background:var(--c1);bottom:-14px;right:-10px;--rot:-8deg;animation-delay:2.4s"></div>
    <div class="deco" style="width:16px;height:16px;background:var(--c6);top:-10px;right:70px;--rot:14deg;animation-delay:3.2s"></div>
    <button class="icon-btn mute-btn menu-mute" aria-label="Audio">
      <svg class="snd-on" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.4h3l4.6-3.8v12.8L7 14.6H4z" fill="currentColor"/>
        <path d="M15.3 9.3a3.8 3.8 0 0 1 0 5.4"/>
        <path d="M17.9 6.9a7.2 7.2 0 0 1 0 10.2"/>
      </svg>
      <svg class="snd-off" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.4h3l4.6-3.8v12.8L7 14.6H4z" fill="currentColor"/>
        <path d="M15.6 9.6l5 4.8M20.6 9.6l-5 4.8"/>
      </svg>
    </button>
    <div class="logo"><span class="k1">B</span><span class="k2">L</span><span class="k3">O</span><span class="k4">K</span><span class="k5">A</span><span class="k6">D</span><span class="k1">O</span></div>
    <div id="menu-sub" data-i18n="menuSub"></div>
    <div class="langs">
      <button class="lang-btn" data-lang="pl">
        <svg viewBox="0 0 20 14" width="20" height="14" aria-hidden="true"><defs><clipPath id="fPL"><rect width="20" height="14" rx="3"/></clipPath></defs><g clip-path="url(#fPL)"><rect width="20" height="14" fill="#F5F2FF"/><rect y="7" width="20" height="7" fill="#D4213D"/><rect width="20" height="4" fill="rgba(255,255,255,.25)"/></g></svg>
        <span>PL</span>
      </button>
      <button class="lang-btn" data-lang="en">
        <svg viewBox="0 0 20 14" width="20" height="14" aria-hidden="true"><defs><clipPath id="fGB"><rect width="20" height="14" rx="3"/></clipPath></defs><g clip-path="url(#fGB)"><rect width="20" height="14" fill="#26418C"/><path d="M0 0 L20 14 M20 0 L0 14" stroke="#F5F2FF" stroke-width="3.4"/><path d="M0 0 L20 14 M20 0 L0 14" stroke="#D4213D" stroke-width="1.3"/><rect x="8" width="4" height="14" fill="#F5F2FF"/><rect y="5" width="20" height="4" fill="#F5F2FF"/><rect x="8.9" width="2.2" height="14" fill="#D4213D"/><rect y="5.9" width="20" height="2.2" fill="#D4213D"/><rect width="20" height="4" fill="rgba(255,255,255,.18)"/></g></svg>
        <span>EN</span>
      </button>
      <button class="lang-btn" data-lang="de">
        <svg viewBox="0 0 20 14" width="20" height="14" aria-hidden="true"><defs><clipPath id="fDE"><rect width="20" height="14" rx="3"/></clipPath></defs><g clip-path="url(#fDE)"><rect width="20" height="4.7" fill="#2A2733"/><rect y="4.7" width="20" height="4.6" fill="#D4213D"/><rect y="9.3" width="20" height="4.7" fill="#FFC145"/><rect width="20" height="4" fill="rgba(255,255,255,.15)"/></g></svg>
        <span>DE</span>
      </button>
      <button class="lang-btn" data-lang="fr">
        <svg viewBox="0 0 20 14" width="20" height="14" aria-hidden="true"><defs><clipPath id="fFR"><rect width="20" height="14" rx="3"/></clipPath></defs><g clip-path="url(#fFR)"><rect width="6.7" height="14" fill="#26418C"/><rect x="6.7" width="6.6" height="14" fill="#F5F2FF"/><rect x="13.3" width="6.7" height="14" fill="#D4213D"/><rect width="20" height="4" fill="rgba(255,255,255,.2)"/></g></svg>
        <span>FR</span>
      </button>
    </div>
    <button class="mode-card m1" data-mode="simple">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5" fill="var(--c6)"/><rect x="4" y="4" width="16" height="6" rx="5" fill="rgba(255,255,255,.28)"/></svg>
      <div><div class="mt" data-i18n="modeSimple"></div><div class="md" data-i18n="modeSimpleD"></div></div>
    </button>
    <button class="mode-card m2" data-mode="advanced">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="3" y="8" width="13" height="13" rx="4" fill="#141221"/><rect x="9" y="3" width="12" height="12" rx="4" fill="var(--c2)"/><rect x="9" y="3" width="12" height="4.5" rx="4" fill="rgba(255,255,255,.3)"/></svg>
      <div><div class="mt" data-i18n="modeAdv"></div><div class="md" data-i18n="modeAdvD"></div></div>
    </button>
    <button class="mode-card m3" data-mode="daily">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="4" fill="var(--c4)"/><rect x="3.5" y="5" width="17" height="5.5" rx="4" fill="rgba(255,255,255,.3)"/><rect x="7" y="2.5" width="2.4" height="4.5" rx="1.2" fill="#F5F2FF"/><rect x="14.6" y="2.5" width="2.4" height="4.5" rx="1.2" fill="#F5F2FF"/></svg>
      <div><div class="mt" data-i18n="modeDaily"></div><div class="md" data-i18n="modeDailyD"></div></div>
    </button>
    <button class="big ghost" id="howto-btn" data-i18n="howto"></button>
    <div class="version" id="version"></div>
  </div>
</div>

<!-- TUTORIAL -->
<div class="overlay" id="tut">
  <div class="panel">
    <div class="tut-vis" id="tut-vis"></div>
    <div class="tut-title" id="tut-title"></div>
    <div class="tut-text" id="tut-text"></div>
    <div class="dots" id="tut-dots"></div>
    <div class="tut-btns">
      <button class="big ghost" id="tut-skip"></button>
      <button class="big alt" id="tut-next"></button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div class="overlay" id="overlay">
  <div class="panel">
    <h2 data-i18n="gameOver"></h2>
    <div class="why" data-i18n="gameOverWhy"></div>
    <div class="final" id="final-score">0</div>
    <div class="sub" data-i18n="points"></div>
    <div class="record" id="new-record" style="display:none" data-i18n="newRecord"></div>
    <div class="btns">
      <button class="big" id="restart" data-i18n="again"></button>
      <button class="big alt" id="share" style="display:none" data-i18n="copyResult"></button>
      <button class="big ghost" id="to-menu" data-i18n="backToMenu"></button>
    </div>
  </div>
</div>

<script>const APP_VERSION = '0.5.2';</script>
<script src="i18n.js?v=0.5.2"></script>
<script src="game.js?v=0.5.2"></script>
</body>
</html>
