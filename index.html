<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blokado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191627; --bg-top:#231F3A; --panel:#221E36; --slot:#2B2745; --slot-line:#332E52;
    --stone:#141221; --text:#F5F2FF; --muted:#9A93B8;
    --c1:#FF6B6B; --c2:#FFC145; --c3:#4ECDC4; --c4:#5AA9E6; --c5:#B388EB; --c6:#9BDE7E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(1100px 700px at 50% -12%, var(--bg-top), var(--bg) 70%);
    color:var(--text);
    font-family:'Nunito',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:12px 10px 20px; overscroll-behavior:none;
    user-select:none;-webkit-user-select:none;
  }
  .logo{font-weight:900;letter-spacing:.5px;line-height:1}
  .logo span{display:inline-block}
  .logo .k1{color:var(--c1);transform:rotate(-4deg)}
  .logo .k2{color:var(--c2)}
  .logo .k3{color:var(--c3);transform:rotate(3deg)}
  .logo .k4{color:var(--c4)}
  .logo .k5{color:var(--c5);transform:rotate(-3deg)}
  .logo .k6{color:var(--c6);transform:rotate(2deg)}

  header{width:min(430px,100%);display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
  header .logo{font-size:24px}
  .hright{display:flex;align-items:center;gap:8px}
  .icon-btn{
    background:var(--panel);border:none;border-radius:10px;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:inset 0 2px 0 var(--slot-line);color:var(--muted);
  }
  .icon-btn:active{transform:translateY(1px)}
  .icon-btn svg{display:block}
  #snd-off{display:none}
  .muted #snd-on{display:none}
  .muted #snd-off{display:block}
  .scores{display:flex;gap:12px;text-align:right}
  .score-box .label{font-size:10px;font-weight:800;color:var(--muted)}
  .score-box .val{font-size:21px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
  #score.bump{animation:bump .3s ease}
  @keyframes bump{40%{transform:scale(1.25);color:var(--c2)}}

  #statusbar{width:min(430px,100%);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:800;color:var(--muted);gap:10px}
  #layout-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tokens{display:flex;align-items:center;gap:5px}
  .tok{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--slot);color:var(--slot-line);box-shadow:inset 0 2px 0 var(--slot-line);transition:all .2s}
  .tok.on{background:var(--c4);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
  .tok.gain{animation:pop .3s ease}

  #board-wrap{position:relative;width:min(430px,100%)}
  #board{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;background:var(--panel);padding:8px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);touch-action:none;transition:filter .5s}
  #board.dim{filter:grayscale(.85) brightness(.55)}
  .cell{aspect-ratio:1;border-radius:7px;background:var(--slot);box-shadow:inset 0 2px 0 var(--slot-line);transition:background .12s;position:relative;display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden}
  .cell.stone{background:var(--stone);box-shadow:inset 0 -3px 0 rgba(255,255,255,.05), inset 0 3px 5px rgba(0,0,0,.6)}
  .cell.star::after{content:'\2605';color:var(--c2);opacity:.55;font-size:16px}
  .cell.filled{box-shadow:inset 0 3px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.22)}
  .cell.gold::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.8), rgba(255,215,80,.25) 55%, transparent 70%)}
  .cell.ice::after{content:'';position:absolute;inset:0;background:rgba(220,240,255,.42);border-radius:7px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.65)}
  .cell.ice.cracked::after{background:rgba(220,240,255,.2);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
  .cell.ice.cracked::before{content:'\26A1';position:absolute;z-index:2;font-size:13px;opacity:.8}
  .cell.pop{animation:pop .18s ease}
  @keyframes pop{0%{transform:scale(.55)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  .cell.preview-ok{opacity:.55;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
  .cell.bomb-preview{outline:3px dashed rgba(255,107,107,.85);outline-offset:-3px}
  .cell.will-clear{outline:3px solid rgba(255,255,255,.75);outline-offset:-3px}
  .cell.clearing{animation:clearAnim .3s ease forwards}
  @keyframes clearAnim{0%{transform:scale(1);filter:brightness(2)}100%{transform:scale(0);filter:brightness(2)}}

  #powerbar-row{width:min(430px,100%);display:flex;align-items:center;gap:10px;margin-top:12px}
  #powerbar{flex:1;display:flex;gap:4px;background:var(--panel);border-radius:10px;padding:5px}
  .seg{flex:1;height:12px;border-radius:6px;background:var(--slot);box-shadow:inset 0 2px 0 var(--slot-line);transition:all .25s}
  .seg.full{background:linear-gradient(90deg,var(--c3),var(--c4));box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
  #powerlabel{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
  #bomb-slot{width:44px;height:44px;border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 var(--slot-line);opacity:.3;touch-action:none}
  #bomb-slot.ready{opacity:1;cursor:grab;animation:glow 1.4s ease infinite}
  @keyframes glow{50%{box-shadow:inset 0 2px 0 var(--slot-line), 0 0 14px rgba(255,107,107,.7)}}

  #tray{width:min(430px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;min-height:128px}
  .piece-slot{background:var(--panel);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-height:124px;gap:6px;touch-action:none}
  .piece{display:grid;gap:3px;cursor:grab}
  .piece.disabled{opacity:.25}
  .nofit{font-size:11px;font-weight:900;color:var(--c1);animation:pulseRed 1.2s ease infinite}
  @keyframes pulseRed{50%{opacity:.35}}
  .pcell{width:18px;height:18px;border-radius:5px;position:relative;overflow:hidden;box-shadow:inset 0 2px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.22)}
  .pcell.empty{background:transparent;box-shadow:none}
  .pcell.gold::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), rgba(255,215,80,.3) 55%, transparent 70%)}
  .rot-btn{background:var(--slot);border:none;border-radius:8px;color:var(--text);font-family:inherit;font-weight:900;font-size:13px;padding:4px 12px;cursor:pointer;box-shadow:inset 0 2px 0 var(--slot-line)}
  .rot-btn:disabled{opacity:.25;cursor:default}
  .rot-btn.unlocked{box-shadow:inset 0 0 0 2px var(--c4)}

  #drag-ghost{position:fixed;left:0;top:0;display:none;grid-gap:4px;pointer-events:none;z-index:50;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
  #drag-ghost .gcell{border-radius:7px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.22)}
  #drag-ghost .gcell.empty{background:transparent;box-shadow:none}
  #drag-ghost .gcell.gold::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), rgba(255,215,80,.3) 55%, transparent 70%)}

  .float-text{position:fixed;z-index:60;pointer-events:none;font-weight:900;font-size:21px;color:var(--c2);text-shadow:0 2px 6px rgba(0,0,0,.5);animation:floatUp 1s ease forwards;white-space:nowrap}
  .float-text.mono{color:var(--c3);font-size:23px}
  .float-text.rot{color:var(--c4)}
  .float-text.gold-t{color:#FFE08A}
  @keyframes floatUp{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

  .overlay{position:fixed;inset:0;background:rgba(14,12,24,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  .overlay.show{display:flex}
  .panel{background:var(--panel);border-radius:20px;padding:28px 30px;text-align:center;width:min(360px,92vw);animation:pop .25s ease;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .panel h2{font-size:24px;font-weight:900;margin-bottom:2px}
  .panel .why{color:var(--muted);font-weight:700;font-size:13px;margin-bottom:8px}
  .panel .final{font-size:42px;font-weight:900;color:var(--c2);margin:8px 0 2px}
  .panel .sub{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:14px}
  .panel .record{color:var(--c3);font-weight:800;font-size:15px;margin-bottom:14px}
  .btns{display:flex;flex-direction:column;gap:10px;align-items:center}
  button.big{font-family:inherit;font-weight:900;font-size:16px;background:var(--c1);color:#fff;border:none;border-radius:12px;padding:12px 28px;cursor:pointer;box-shadow:inset 0 3px 0 rgba(255,255,255,.3), 0 4px 0 #C74A4A}
  button.big.alt{background:var(--c4);box-shadow:inset 0 3px 0 rgba(255,255,255,.3), 0 4px 0 #3D7DB0}
  button.big.ghost{background:var(--slot);box-shadow:inset 0 2px 0 var(--slot-line);color:var(--muted)}
  button.big:active{transform:translateY(3px)}

  /* MENU */
  #menu .panel{padding:36px 28px 30px;position:relative;overflow:visible}
  #menu .logo{font-size:42px;margin-bottom:4px}
  #menu-sub{color:var(--muted);font-weight:800;font-size:13px;margin-bottom:20px}
  .deco{position:absolute;border-radius:9px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.25);animation:floaty 5s ease-in-out infinite;z-index:-1}
  @keyframes floaty{50%{transform:translateY(-8px) rotate(var(--rot))}}
  .deco{transform:rotate(var(--rot))}
  .langs{display:flex;justify-content:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .lang-btn{display:flex;align-items:center;gap:7px;background:var(--slot);border:none;border-radius:10px;color:var(--muted);font-family:inherit;font-weight:900;font-size:12px;padding:8px 11px;cursor:pointer;box-shadow:inset 0 2px 0 var(--slot-line)}
  .lang-btn svg{display:block;border-radius:3px}
  .lang-btn.active{color:var(--text);box-shadow:inset 0 0 0 2px var(--c4)}
  .mode-card{display:flex;align-items:center;gap:14px;width:100%;background:var(--slot);border:none;border-radius:14px;color:var(--text);font-family:inherit;text-align:left;padding:13px 16px;cursor:pointer;box-shadow:inset 0 2px 0 var(--slot-line);margin-bottom:10px}
  .mode-card:active{transform:scale(.98)}
  .mode-card svg{flex-shrink:0}
  .mode-card .mt{font-weight:900;font-size:16px;margin-bottom:2px}
  .mode-card .md{font-weight:700;font-size:12px;color:var(--muted)}
  .mode-card.m1 .mt{color:var(--c6)} .mode-card.m2 .mt{color:var(--c2)} .mode-card.m3 .mt{color:var(--c4)}
  #howto-btn{margin-top:6px}

  /* TUTORIAL */
  #tut .panel{min-height:380px;display:flex;flex-direction:column}
  .tut-vis{height:110px;display:flex;align-items:center;justify-content:center;gap:6px;margin:14px 0}
  .tv-cell{width:30px;height:30px;border-radius:7px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;font-size:16px}
  .tv-cell.ghosty{opacity:.45;outline:2px dashed rgba(255,255,255,.6);outline-offset:-2px}
  .tv-cell.pulse{animation:tvpulse 1.2s ease infinite}
  @keyframes tvpulse{50%{transform:scale(1.12);filter:brightness(1.5)}}
  .tv-icon{font-size:30px}
  .tv-mini{display:grid;grid-template-columns:repeat(2,26px);gap:3px}
  .tv-mini div{width:26px;height:26px;border-radius:6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
  .tut-title{font-weight:900;font-size:19px;margin-bottom:6px}
  .tut-text{font-weight:700;font-size:14px;color:var(--muted);line-height:1.5;flex:1}
  .dots{display:flex;justify-content:center;gap:7px;margin:16px 0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--slot)}
  .dot.on{background:var(--c4)}
  .tut-btns{display:flex;gap:10px;justify-content:center}

  footer{margin-top:12px;color:var(--muted);font-size:11px;font-weight:700;text-align:center;line-height:1.6;max-width:430px}
  .credits{margin-top:8px;opacity:.85}
  .credits a{color:var(--c4);text-decoration:none;border-bottom:1px dotted var(--c4)}

  @media (prefers-reduced-motion: reduce){
    .deco,.tv-cell.pulse,#bomb-slot.ready,.nofit{animation:none}
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="k1">B</span><span class="k2">L</span><span class="k3">O</span><span class="k4">K</span><span class="k5">A</span><span class="k6">D</span><span class="k1">O</span></div>
  <div class="hright">
    <button class="icon-btn" id="menu-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <rect x="3" y="3" width="8" height="8" rx="2.5" fill="var(--c1)"/>
        <rect x="13" y="3" width="8" height="8" rx="2.5" fill="var(--c2)"/>
        <rect x="3" y="13" width="8" height="8" rx="2.5" fill="var(--c3)"/>
        <rect x="13" y="13" width="8" height="8" rx="2.5" fill="var(--c4)"/>
      </svg>
    </button>
    <button class="icon-btn" id="mute" aria-label="Audio">
      <svg id="snd-on" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.4h3l4.6-3.8v12.8L7 14.6H4z" fill="currentColor"/>
        <path d="M15.3 9.3a3.8 3.8 0 0 1 0 5.4"/>
        <path d="M17.9 6.9a7.2 7.2 0 0 1 0 10.2"/>
      </svg>
      <svg id="snd-off" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.4h3l4.6-3.8v12.8L7 14.6H4z" fill="currentColor"/>
        <path d="M15.6 9.6l5 4.8M20.6 9.6l-5 4.8"/>
      </svg>
    </button>
    <div class="scores">
      <div class="score-box"><div class="label" data-i18n="score">Wynik</div><div class="val" id="score">0</div></div>
      <div class="score-box"><div class="label" data-i18n="best">Rekord</div><div class="val" id="best">0</div></div>
    </div>
  </div>
</header>

<div id="statusbar">
  <div id="layout-name"></div>
  <div class="tokens">
    <span style="font-size:14px">&#8635;</span>
    <div class="tok" id="tok0">&#8635;</div>
    <div class="tok" id="tok1">&#8635;</div>
    <div class="tok" id="tok2">&#8635;</div>
  </div>
</div>

<div id="board-wrap"><div id="board"></div></div>

<div id="powerbar-row">
  <div id="powerlabel" data-i18n="colorbar">Pasek koloru</div>
  <div id="powerbar"><div class="seg"></div><div class="seg"></div><div class="seg"></div></div>
  <div id="bomb-slot" aria-label="Bomb">
    <svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true">
      <path d="M15.6 8.4 Q17.2 5.6 19.4 6.2" stroke="var(--c5)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="5.8" r="1.7" fill="var(--c2)"/>
      <circle cx="11" cy="14" r="7.6" fill="#2E2945"/>
      <circle cx="11" cy="14" r="7.6" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
      <circle cx="8.4" cy="11.4" r="2.3" fill="rgba(255,255,255,.32)"/>
    </svg>
  </div>
</div>

<div id="tray"></div>
<div id="drag-ghost"></div>
<footer>
  <div id="hint" data-i18n="hint"></div>
  <div class="credits" data-i18n="credits"></div>
</footer>

<!-- MENU -->
<div class="overlay show" id="menu">
  <div class="panel">
    <div class="deco" style="width:30px;height:30px;background:var(--c2);top:-14px;left:-12px;--rot:-12deg;animation-delay:0s"></div>
    <div class="deco" style="width:22px;height:22px;background:var(--c3);top:24px;right:-14px;--rot:9deg;animation-delay:.8s"></div>
    <div class="deco" style="width:24px;height:24px;background:var(--c5);bottom:60px;left:-16px;--rot:7deg;animation-delay:1.6s"></div>
    <div class="deco" style="width:32px;height:32px;background:var(--c1);bottom:-14px;right:-10px;--rot:-8deg;animation-delay:2.4s"></div>
    <div class="deco" style="width:16px;height:16px;background:var(--c6);top:-10px;right:70px;--rot:14deg;animation-delay:3.2s"></div>
    <div class="logo"><span class="k1">B</span><span class="k2">L</span><span class="k3">O</span><span class="k4">K</span><span class="k5">A</span><span class="k6">D</span><span class="k1">O</span></div>
    <div id="menu-sub" data-i18n="menuSub"></div>
    <div class="langs">
      <button class="lang-btn" data-lang="pl">
        <svg viewBox="0 0 20 14" width="20" height="14" aria-hidden="true"><defs><clipPath id="fPL"><rect width="20" height="14" rx="3"/></clipPath></defs><g clip-path="url(#fPL)"><rect width="20" height="14" fill="#F5F2FF"/><rect y="7" width="20" height="7" fill="#D4213D"/><rect width="20" height="4" fill="rgba(255,255,255,.25)"/></g></svg>
        <span>PL</span>
      </button>
      <button class="lang-btn" data-lang="en">
        <svg viewBox="0 0 20 14" width="20" height="14" aria-hidden="true"><defs><clipPath id="fGB"><rect width="20" height="14" rx="3"/></clipPath></defs><g clip-path="url(#fGB)"><rect width="20" height="14" fill="#26418C"/><path d="M0 0 L20 14 M20 0 L0 14" stroke="#F5F2FF" stroke-width="3.4"/><path d="M0 0 L20 14 M20 0 L0 14" stroke="#D4213D" stroke-width="1.3"/><rect x="8" width="4" height="14" fill="#F5F2FF"/><rect y="5" width="20" height="4" fill="#F5F2FF"/><rect x="8.9" width="2.2" height="14" fill="#D4213D"/><rect y="5.9" width="20" height="2.2" fill="#D4213D"/><rect width="20" height="4" fill="rgba(255,255,255,.18)"/></g></svg>
        <span>EN</span>
      </button>
      <button class="lang-btn" data-lang="de">
        <svg viewBox="0 0 20 14" width="20" height="14" aria-hidden="true"><defs><clipPath id="fDE"><rect width="20" height="14" rx="3"/></clipPath></defs><g clip-path="url(#fDE)"><rect width="20" height="4.7" fill="#2A2733"/><rect y="4.7" width="20" height="4.6" fill="#D4213D"/><rect y="9.3" width="20" height="4.7" fill="#FFC145"/><rect width="20" height="4" fill="rgba(255,255,255,.15)"/></g></svg>
        <span>DE</span>
      </button>
      <button class="lang-btn" data-lang="fr">
        <svg viewBox="0 0 20 14" width="20" height="14" aria-hidden="true"><defs><clipPath id="fFR"><rect width="20" height="14" rx="3"/></clipPath></defs><g clip-path="url(#fFR)"><rect width="6.7" height="14" fill="#26418C"/><rect x="6.7" width="6.6" height="14" fill="#F5F2FF"/><rect x="13.3" width="6.7" height="14" fill="#D4213D"/><rect width="20" height="4" fill="rgba(255,255,255,.2)"/></g></svg>
        <span>FR</span>
      </button>
    </div>
    <button class="mode-card m1" data-mode="simple">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5" fill="var(--c6)"/><rect x="4" y="4" width="16" height="6" rx="5" fill="rgba(255,255,255,.28)"/></svg>
      <div><div class="mt" data-i18n="modeSimple"></div><div class="md" data-i18n="modeSimpleD"></div></div>
    </button>
    <button class="mode-card m2" data-mode="advanced">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="3" y="8" width="13" height="13" rx="4" fill="#141221"/><rect x="9" y="3" width="12" height="12" rx="4" fill="var(--c2)"/><rect x="9" y="3" width="12" height="4.5" rx="4" fill="rgba(255,255,255,.3)"/></svg>
      <div><div class="mt" data-i18n="modeAdv"></div><div class="md" data-i18n="modeAdvD"></div></div>

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function ac(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, delay, dur, type, vol){
  if(muted) return;
  const ctx = ac();
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}

}

    const d = document.createElement('div');
    d.className = 'dot' + (i===tutStep ? ' on' : '');
    dots.appendChild(d);
  });
  const last = tutStep === slides.length-1;
  document.getElementById('tut-next').textContent = last ? (tutDone ? t('play') : t('done')) : t('next');
  document.getElementById('tut-skip').textContent = t('skip');
  document.getElementById('tut-skip').style.visibility = last ? 'hidden' : 'visible';
}

}

function newGame(){
  rng = (mode === 'daily') ? mulberry32(todaySeed()) : Math.random;
  let layoutIdx;
  if(mode === 'simple') layoutIdx = 0;
  else if(mode === 'advanced') layoutIdx = 1 + Math.floor(rng()*(LAYOUTS.length-1));
  else layoutIdx = Math.floor(rng()*LAYOUTS.length);
  currentLayoutIdx = layoutIdx;
  const layout = LAYOUTS[layoutIdx];
  setLayoutLabel();

  board = Array.from({length:N}, () => Array(N).fill(null));
  layout.stones.forEach(([r,c])=>{ board[r][c] = {t:'stone'}; });
  stars = new Set(layout.stars.map(([r,c])=>r+','+c));

  score = 0; streak = 0; pieces = []; gameOver = false;
  rotTokens = MAX_TOKENS; monoCharge = 0; bombReady = false; refillCount = 0;
  scoreEl.textContent = 0;
  bestEl.textContent = best[mode];
  boardEl.classList.remove('dim');
  updateTokens(); updateBar();
  renderBoard();
  refillTray();
  overlay.classList.remove('show');
}

function updateScore(add){
  score += add;
  scoreEl.textContent = score;
  if(add > 0){ scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
  if(score > best[mode]){ best[mode] = score; bestEl.textContent = score; }
}

function updateTokens(gained){
  for(let i=0;i<MAX_TOKENS;i++){
    const el = document.getElementById('tok'+i);
    el.classList.toggle('on', i < rotTokens);
    if(gained && i === rotTokens-1){ el.classList.remove('gain'); void el.offsetWidth; el.classList.add('gain'); }
  }
}

function updateBar(){
  segs.forEach((s,i)=> s.classList.toggle('full', i < monoCharge));
  bombSlot.classList.toggle('ready', bombReady);
}

function renderBoard(){
  boardEl.innerHTML = '';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d = document.createElement('div');
    d.className = 'cell';
    const v = board[r][c];
    if(v){
      if(v.t === 'stone') d.classList.add('stone');
      else{
        d.classList.add('filled');
        d.style.background = v.color;
        if(v.kind === 'g') d.classList.add('gold');
        if(v.kind === 'i'){ d.classList.add('ice'); if(v.hp === 1) d.classList.add('cracked'); }
      }
    } else if(stars.has(r+','+c)) d.classList.add('star');
    boardEl.appendChild(d);
  }
}

function cellAt(r,c){ return boardEl.children[r*N+c]; }

function rotateCells(cells){
  const maxR = Math.max(...cells.map(x=>x[0]));
  return cells.map(([r,c])=>[c, maxR - r]);
}

function pickShape(){
  const bag = [];
  SHAPES.forEach((s,i)=>{ for(let k=0;k<s.w;k++) bag.push(i); });
  return SHAPES[bag[Math.floor(rng()*bag.length)]];
}

function genPiece(){
  const shape = pickShape();
  const goldIdx = (rng() < 0.12) ? Math.floor(rng()*shape.cells.length) : -1;
  return { cells: shape.cells.map(x=>x.slice()), color: COLORS[Math.floor(rng()*COLORS.length)],
           used:false, rotUnlocked:false, goldIdx };
}

function refillTray(){
  refillCount++;
  // Uczciwe rozdanie: max JEDEN duży klocek (6+ pól) na tackę,
  // a jeśli świeże rozdanie w całości nie pasuje - przelosuj (do 5 prób).
  // W trybie dziennym determinizm zachowany (przelosowania z tego samego ziarna).
  let attempts = 0;
  do{
    pieces = [];
    let bigUsed = false;
    for(let k=0;k<3;k++){
      let pc, guard = 0;
      do{ pc = genPiece(); guard++; } while(bigUsed && pc.cells.length >= 6 && guard < 30);
      if(pc.cells.length >= 6) bigUsed = true;
      pieces.push(pc);
    }
    attempts++;
  } while(attempts < 5 && !pieces.some(p=>fitsAnywhereCells(p.cells)));
  if(mode !== 'simple' && refillCount % 4 === 0) spawnIce();
  renderTray();
}

function spawnIce(){
  const empty = [];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(board[r][c]===null) empty.push([r,c]);
  if(empty.length < 20) return;
  const [r,c] = empty[Math.floor(rng()*empty.length)];
  board[r][c] = {t:'b', color:'#7FB8D8', kind:'i', hp:2};
  renderBoard();
  sndIce();
}

function renderTray(){
  trayEl.innerHTML = '';
  pieces.forEach((p,idx)=>{
    const slot = document.createElement('div');
    slot.className = 'piece-slot';
    if(!p.used){
      const rows = Math.max(...p.cells.map(c=>c[0]))+1;
      const cols = Math.max(...p.cells.map(c=>c[1]))+1;
      const el = document.createElement('div');
      el.className = 'piece';
      el.style.gridTemplateColumns = `repeat(${cols},18px)`;
      const map = {};
      p.cells.forEach((c,i)=>{ map[c[0]+','+c[1]] = i; });
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
        const d = document.createElement('div');
        const key = r+','+c;
        if(key in map){
          d.className = 'pcell' + (map[key] === p.goldIdx ? ' gold' : '');
          d.style.background = p.color;
        } else d.className = 'pcell empty';
        el.appendChild(d);
      }
      const fits = affordableFits(p);
      if(!fits){
        el.classList.add('disabled');
        slot.appendChild(el);
        const warn = document.createElement('div');
        warn.className = 'nofit'; warn.textContent = t('nofit');
        slot.appendChild(warn);
      } else {
        el.addEventListener('pointerdown', e => startDrag(e, idx));
        slot.appendChild(el);
        const rb = document.createElement('button');
        rb.className = 'rot-btn' + (p.rotUnlocked ? ' unlocked' : '');
        rb.innerHTML = '&#8635;';
        rb.disabled = !p.rotUnlocked && rotTokens === 0;
        rb.title = p.rotUnlocked ? t('rotFreeTip') : t('rotUnlockTip');
        rb.addEventListener('click', ev => { ev.stopPropagation(); rotatePiece(idx); });
        rb.addEventListener('pointerdown', ev => ev.stopPropagation());
        slot.appendChild(rb);
      }
    }
    trayEl.appendChild(slot);
  });
}

function rotatePiece(idx){
  const p = pieces[idx];
  if(!p.rotUnlocked){
    if(rotTokens === 0) return;
    rotTokens--; p.rotUnlocked = true;
    updateTokens();
  }
  p.cells = rotateCells(p.cells);
  sndRotate();
  renderTray();
}

function canPlace(cells, r0, c0){
  return cells.every(([r,c])=>{
    const rr=r0+r, cc=c0+c;
    return rr>=0 && rr<N && cc>=0 && cc<N && board[rr][cc]===null;
  });
}

function fitsAnywhereCells(cells){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(canPlace(cells,r,c)) return true;
  return false;
}

function affordableFits(p){
  if(fitsAnywhereCells(p.cells)) return true;
  if(p.rotUnlocked || rotTokens > 0){
    let cs = p.cells;
    for(let i=0;i<3;i++){
      cs = rotateCells(cs);
      if(fitsAnywhereCells(cs)) return true;
    }
  }
  return false;
}

// ================= Drag & drop =================
function startDrag(e, idx){
  if(gameOver) return;
  const isBomb = (idx === 'bomb');
  const p = isBomb ? null : pieces[idx];
  if(!isBomb && !fitsAnywhereCells(p.cells)){ sndBad(); return; }
  e.preventDefault();
  sndPick();

  const boardRect = boardEl.getBoundingClientRect();
  const cellSize = (boardRect.width - 16 - 4*(N-1)) / N;
  const cells = isBomb ? [[0,0]] : p.cells;
  const rows = Math.max(...cells.map(c=>c[0]))+1;
  const cols = Math.max(...cells.map(c=>c[1]))+1;

  ghostEl.innerHTML = '';
  ghostEl.style.display = 'grid';
  ghostEl.style.gridTemplateColumns = `repeat(${cols},${cellSize}px)`;
  const map = {};
  cells.forEach((c,i)=>{ map[c[0]+','+c[1]] = i; });
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const d = document.createElement('div');
    const key = r+','+c;
    d.style.width = d.style.height = cellSize+'px';
    if(key in map){
      d.className = 'gcell' + (!isBomb && map[key] === p.goldIdx ? ' gold' : '');
      if(isBomb){ d.style.background = 'var(--c1)'; d.style.fontSize = cellSize*0.6+'px'; d.textContent = '\u{1F4A3}'; }
      else d.style.background = p.color;
    } else d.className = 'gcell empty';
    ghostEl.appendChild(d);
  }

  const touchLift = e.pointerType === 'touch' ? 70 : 0;
  dragging = {idx, p, isBomb, cellSize, touchLift,
              gw: cols*cellSize + (cols-1)*4, gh: rows*cellSize + (rows-1)*4};
  moveDrag(e);
  window.addEventListener('pointermove', moveDrag, {passive:false});
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
}

function ghostOrigin(e){
  return {x: e.clientX - dragging.gw/2, y: e.clientY - dragging.gh/2 - dragging.touchLift};
}

function moveDrag(e){
  if(!dragging) return;
  e.preventDefault();
  const {x,y} = ghostOrigin(e);
  ghostEl.style.transform = `translate(${x}px,${y}px)`;
  clearPreview();
  const tc = targetCell(x,y);
  if(!tc) return;
  if(dragging.isBomb) showBombPreview(tc.r, tc.c);
  else if(canPlace(dragging.p.cells, tc.r, tc.c)) showPreview(tc.r, tc.c);
}

function targetCell(gx, gy){
  const br = boardEl.getBoundingClientRect();
  const cs = dragging.cellSize + 4;
  const c = Math.round((gx - br.left - 8) / cs);
  const r = Math.round((gy - br.top - 8) / cs);
  if(r < -1 || r > N || c < -1 || c > N) return null;
  return {r: Math.max(0, Math.min(N-1, r)), c: Math.max(0, Math.min(N-1, c))};
}

function clearPreview(){
  boardEl.querySelectorAll('.preview-ok,.will-clear,.bomb-preview').forEach(el=>{
    el.classList.remove('preview-ok','will-clear','bomb-preview');
    if(!el.classList.contains('filled')) el.style.background = '';
  });
}

function showPreview(r0,c0){
  const p = dragging.p;
  const temp = board.map(row=>row.slice());
  p.cells.forEach(([r,c])=>{ temp[r0+r][c0+c] = {t:'b', color:p.color, kind:'n'}; });
  p.cells.forEach(([r,c])=>{
    const el = cellAt(r0+r, c0+c);
    el.classList.add('preview-ok');
    el.style.background = p.color;
  });
  const lines = findFullLines(temp);
  lines.rows.forEach(r=>{ for(let c=0;c<N;c++) cellAt(r,c).classList.add('will-clear'); });
  lines.cols.forEach(c=>{ for(let r=0;r<N;r++) cellAt(r,c).classList.add('will-clear'); });
}

function showBombPreview(r0,c0){
  for(let r=r0-1;r<=r0+1;r++)for(let c=c0-1;c<=c0+1;c++){
    if(r>=0 && r<N && c>=0 && c<N) cellAt(r,c).classList.add('bomb-preview');
  }
}

function endDrag(e){
  window.removeEventListener('pointermove', moveDrag);
  window.removeEventListener('pointerup', endDrag);
  window.removeEventListener('pointercancel', endDrag);
  if(!dragging) return;
  const {x,y} = ghostOrigin(e);
  const tc = targetCell(x,y);
  const d = dragging;
  dragging = null;
  ghostEl.style.display = 'none';
  clearPreview();
  if(!tc){ sndBad(); return; }
  if(d.isBomb){ detonate(tc.r, tc.c, e); return; }
  if(canPlace(d.p.cells, tc.r, tc.c)) placePiece(d.idx, tc.r, tc.c, e);
  else { sndBad(); renderTray(); }
}

// ================= Bomba =================
bombSlot.addEventListener('pointerdown', e => { if(bombReady && !gameOver) startDrag(e, 'bomb'); });

function detonate(r0, c0, e){
  bombReady = false;
  updateBar();
  let destroyed = 0;
  for(let r=r0-1;r<=r0+1;r++)for(let c=c0-1;c<=c0+1;c++){
    if(r<0||r>=N||c<0||c>=N) continue;
    const v = board[r][c];
    if(v && v.t === 'b'){ board[r][c] = null; destroyed++; cellAt(r,c).classList.add('clearing'); }
  }
  sndBomb();
  updateScore(destroyed * BOMB_PER_CELL);
  showFloatText(e, t('boom') + ' +' + (destroyed*BOMB_PER_CELL), '');
  setTimeout(()=>{ renderBoard(); renderTray(); checkGameOver(); }, 320);
}

// ================= Logika =================
function placePiece(idx, r0, c0, e){
  const p = pieces[idx];
  let starHits = 0;
  p.cells.forEach(([r,c],i)=>{
    const rr = r0+r, cc = c0+c;
    board[rr][cc] = {t:'b', color:p.color, kind: (i===p.goldIdx ? 'g' : 'n')};
    if(stars.has(rr+','+cc)){ stars.delete(rr+','+cc); starHits++; }
    const el = cellAt(rr, cc);
    el.classList.remove('star');
    el.classList.add('filled','pop');
    if(i===p.goldIdx) el.classList.add('gold');
    el.style.background = p.color;
  });
  p.used = true;
  updateScore(p.cells.length);
  sndPlace();
  if(starHits > 0){
    updateScore(starHits * STAR_BONUS);
    sndStar();
    showFloatText(e, '\u2605 +' + starHits*STAR_BONUS, 'gold-t', -30);
  }

  const lines = findFullLines(board);
  const nLines = lines.rows.length + lines.cols.length;
  if(nLines > 0){
    streak++;
    let monoLines = 0, goldCleared = 0;
    const lineCells = collectLineCells(lines);
    lines.rows.forEach(r=>{ if(isMonoRow(r)) monoLines++; });
    lines.cols.forEach(c=>{ if(isMonoCol(c)) monoLines++; });
    lineCells.forEach(key=>{
      const [r,c] = key.split(',').map(Number);
      const v = board[r][c];
      if(v && v.t==='b' && v.kind==='g') goldCleared++;
    });

    const lineBonus = nLines*9 + (nLines-1)*9 + (streak-1)*5;
    const monoBonus = monoLines * MONO_BONUS;
    const goldBonus = goldCleared * GOLD_BONUS;
    updateScore(lineBonus + monoBonus + goldBonus);
    sndClear(nLines, monoLines > 0);
    if(goldCleared > 0) sndGold();
    showFloat(e, nLines, lineBonus, monoLines, monoBonus, goldCleared, goldBonus);

    if(monoLines > 0 && !bombReady){
      monoCharge = Math.min(BAR_MAX, monoCharge + monoLines);
      if(monoCharge >= BAR_MAX){ monoCharge = 0; bombReady = true; }
      updateBar();
    }
    if(nLines >= 4 && rotTokens < MAX_TOKENS){
      rotTokens++;
      updateTokens(true);
      sndToken();
      showFloatText(e, t('rotGain'), 'rot', -70);
    }
    animateClear(lines);
  } else {
    streak = 0;
  }

  if(pieces.every(x=>x.used)) refillTray();
  else renderTray();

  setTimeout(checkGameOver, nLines > 0 ? 350 : 50);
}

function isMonoRow(r){
  let col = null;
  for(let c=0;c<N;c++){
    const v = board[r][c];
    if(!v || v.t==='stone') continue;
    if(col === null) col = v.color;
    else if(v.color !== col) return false;
  }
  return col !== null;
}
function isMonoCol(c){
  let col = null;
  for(let r=0;r<N;r++){
    const v = board[r][c];
    if(!v || v.t==='stone') continue;
    if(col === null) col = v.color;
    else if(v.color !== col) return false;
  }
  return col !== null;
}

function findFullLines(b){
  const rows=[], cols=[];
  for(let r=0;r<N;r++) if(b[r].every(v=>v!==null)) rows.push(r);
  for(let c=0;c<N;c++){
    let full=true;
    for(let r=0;r<N;r++) if(b[r][c]===null){full=false;break}
    if(full) cols.push(c);
  }
  return {rows, cols};
}

function collectLineCells(lines){
  const s = new Set();
  lines.rows.forEach(r=>{for(let c=0;c<N;c++)s.add(r+','+c)});
  lines.cols.forEach(c=>{for(let r=0;r<N;r++)s.add(r+','+c)});
  return s;
}

function animateClear(lines){
  const toClear = collectLineCells(lines);
  let anyIce = false;
  toClear.forEach(key=>{
    const [r,c] = key.split(',').map(Number);
    const v = board[r][c];
    if(!v || v.t === 'stone') return;
    if(v.kind === 'i' && v.hp > 1){ anyIce = true; return; }
    cellAt(r,c).classList.add('clearing');
  });
  if(anyIce) sndIce();
  setTimeout(()=>{
    toClear.forEach(key=>{
      const [r,c] = key.split(',').map(Number);
      const v = board[r][c];
      if(!v || v.t === 'stone') return;
      if(v.kind === 'i' && v.hp > 1){ v.hp--; return; }
      board[r][c] = null;
    });
    renderBoard();
  }, 300);
}

function showFloat(e, nLines, lineBonus, monoLines, monoBonus, goldCleared, goldBonus){
  const msgs = t('floats');
  showFloatText(e, msgs[Math.min(nLines,4)-1] + ' +' + lineBonus, '');
  if(monoLines > 0) showFloatText(e, t('mono') + ' +' + monoBonus, 'mono', -36);
  if(goldCleared > 0) showFloatText(e, t('gold') + ' +' + goldBonus, 'gold-t', -104);
}

function showFloatText(e, text, cls, dy){
  const el = document.createElement('div');
  el.className = 'float-text' + (cls ? ' ' + cls : '');
  el.textContent = text;
  el.style.left = Math.min(e.clientX, window.innerWidth-190) + 'px';
  el.style.top = (e.clientY - 60 + (dy||0)) + 'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

function checkGameOver(){
  const alive = pieces.filter(p=>!p.used);
  if(alive.length && alive.every(p=>!affordableFits(p)) && !bombReady){
    gameOver = true;
    boardEl.classList.add('dim');
    sndGameOver();
    setTimeout(()=>{
      document.getElementById('final-score').textContent = score;
      document.getElementById('new-record').style.display = (score >= best[mode] && score > 0) ? 'block' : 'none';
      document.getElementById('share').style.display = (mode === 'daily') ? 'inline-block' : 'none';
      overlay.classList.add('show');
    }, 700);
  } else {
    renderTray();
  }
}

// ================= Share / restart =================
document.getElementById('share').addEventListener('click', function(){
  const txt = t('shareText')(todayStr(), score);
  const btn = this;
  function done(){ btn.textContent = t('copied'); setTimeout(()=>btn.textContent = t('copyResult'), 1500); }
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); done(); }catch(err){}
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(fallback);
  } else fallback();
});

document.getElementById('restart').addEventListener('click', ()=>{ sndUi(); newGame(); });

// ================= Start =================
applyLang();
</script>
